services:
  db:
    container_name: Santisimo_Salvador
    image: postgres:16.3
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=Servicio_Com1
      - POSTGRES_DB=SantisimoServer
    restart: always
    ports:
      - '5438:5432'

  pgAdmin:
    depends_on:
      - db
    image: dpage/pgadmin4:8.6
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    ports:
      - '8081:80'
    environment:
      - PGADMIN_DEFAULT_PASSWORD=Servicio_Com1
      - PGADMIN_DEFAULT_EMAIL=admin@google.com
    restart: always
